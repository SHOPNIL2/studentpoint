<!DOCTYPE html>
<html lang="bn" style="color-scheme: dark;"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Student Point Academic Care</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;700&amp;display=swap">
<style>
:root{--g1:#efe7ff;--g2:#e1f0ff;--g3:#ffe6f2;--g4:#e6fbf1;--surface:rgba(255,255,255,.84);--text:#231a3a;--muted:#5d5278;--brand:#5b21b6;--brand2:#7c3aed;--gold:#f5b82e;--line:#d9ccf5;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--g1:#1b1233;--g2:#10203a;--g3:#2a1230;--g4:#0f2a27;--surface:rgba(32,22,58,.88);--text:#efe9ff;--muted:#b9acd9;--line:#3b2d63;--brand:#a78bfa;color-scheme:dark}}
:root[data-theme="dark"]{--g1:#1b1233;--g2:#10203a;--g3:#2a1230;--g4:#0f2a27;--surface:rgba(32,22,58,.88);--text:#efe9ff;--muted:#b9acd9;--line:#3b2d63;--brand:#a78bfa;color-scheme:dark}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;color:var(--text);font:17px/1.7 "Hind Siliguri","Noto Sans Bengali",sans-serif;background:linear-gradient(120deg,var(--g1),var(--g2),var(--g3),var(--g4),var(--g1));background-size:400% 400%;animation:bg 45s ease-in-out infinite}
@keyframes bg{0%,100%{background-position:0 50%}50%{background-position:100% 50%}}
@media (prefers-reduced-motion:reduce){body{animation:none}}
.wrap{max-width:980px;margin:0 auto;padding:0 18px}
.notice{background:var(--brand2);color:#fff;text-align:center;padding:8px 14px;font-weight:500}
.hero{padding:40px 0 20px}.hero h1{font-size:clamp(30px,7vw,54px);line-height:1.2;margin:0 0 10px;color:var(--brand)}
.hero p{margin:0 0 18px;max-width:34em;color:var(--muted);font-size:19px}
.btn{display:inline-block;padding:11px 22px;border-radius:999px;font-weight:700;text-decoration:none;margin:0 8px 8px 0;background:var(--brand2);color:#fff;border:2px solid var(--brand2);font:inherit;font-weight:700;cursor:pointer}
.btn.o{background:none;color:var(--brand)}
a:focus-visible,button:focus-visible,input:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
section{padding:22px 0}.head{display:flex;align-items:center;gap:12px;margin-bottom:12px}h2{font-size:26px;margin:0;line-height:1.3}
.add,.edit{width:36px;height:36px;border-radius:50%;border:2px dashed var(--brand2);background:none;color:var(--brand);font-size:22px;line-height:1;cursor:pointer}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px 18px}
.card h3{margin:0 0 4px;font-size:20px}.card p{margin:0;color:var(--muted);font-size:16px}.card a{color:var(--brand);font-weight:700}
.adm .card,.adm tr{cursor:pointer;outline:1px dashed var(--brand2)}
.hl{background:linear-gradient(135deg,#5b21b6,#7c3aed);color:#fff;border-radius:16px;padding:20px}.hl h2{color:#fff}
.hl .card{background:rgba(255,255,255,.14);border-color:rgba(255,255,255,.25)}.hl .card p{color:#efe6ff}
.tag{display:inline-block;background:var(--gold);color:#3b2700;font-weight:700;border-radius:999px;padding:2px 12px;font-size:15px;margin-bottom:10px}
.t{text-align:center}.t img,.av{width:140px;height:140px;border-radius:50%;object-fit:cover;border:4px solid var(--brand2);margin-bottom:8px}
.av{display:inline-flex;align-items:center;justify-content:center;font-size:48px;color:#fff;background:var(--brand2)}
.tbl{overflow-x:auto}table{border-collapse:collapse;width:100%;min-width:460px;background:var(--surface);border-radius:12px}
th,td{text-align:left;padding:11px 14px;border-bottom:1px solid var(--line)}th{background:var(--brand2);color:#fff;font-weight:500}
details{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 16px;margin-bottom:10px}summary{font-weight:700;cursor:pointer}
form.f{display:grid;gap:10px;max-width:420px}input,select{font:inherit;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--text);width:100%}
.wa{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));background:#25d366;color:#fff;border-radius:999px;padding:12px 18px;font-weight:700;text-decoration:none;box-shadow:0 4px 14px rgba(0,0,0,.25);z-index:5}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center;padding:16px;z-index:20}
.md{background:var(--surface);backdrop-filter:blur(6px);background-color:var(--g1);border-radius:16px;padding:20px;width:100%;max-width:400px;display:grid;gap:10px}
.md h3{margin:0}.row{display:flex;gap:8px;flex-wrap:wrap}.dg{background:#b3261e;border-color:#b3261e}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:80px;background:#222;color:#fff;padding:8px 16px;border-radius:999px;z-index:30;font-size:15px}
#toast:empty{display:none}
nav.nv{position:sticky;top:env(safe-area-inset-top,0px);z-index:8;display:flex;gap:6px;overflow-x:auto;padding:8px 14px;background:var(--surface);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
nav.nv a,nav.nv button{white-space:nowrap;text-decoration:none;color:var(--brand);font:inherit;font-weight:500;padding:3px 12px;border-radius:999px;border:1px solid var(--line);background:none;cursor:pointer}
section{scroll-margin-top:56px}.bar{height:10px;border-radius:99px;background:var(--line);overflow:hidden;margin:8px 0 4px}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--brand2),var(--gold))}
.sm{font-size:14px;color:var(--muted)}.pb{position:fixed;top:0;left:0;height:3px;background:var(--gold);z-index:40;width:0}
.aib{position:fixed;left:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));background:var(--brand2);color:#fff;border:0;border-radius:999px;padding:7px 12px;font:inherit;font-size:14px;font-weight:700;z-index:6;cursor:pointer;box-shadow:0 4px 14px rgba(0,0,0,.25)}
.aip{position:fixed;left:12px;right:12px;bottom:calc(76px + env(safe-area-inset-bottom,0px));max-width:380px;height:min(60vh,460px);background:var(--g1);border:1px solid var(--line);border-radius:16px;z-index:12;flex-direction:column;overflow:hidden;box-shadow:0 8px 30px rgba(0,0,0,.35)}
.aih{padding:10px 14px;background:var(--brand2);color:#fff;font-weight:700}.ail{flex:1;overflow-y:auto;padding:10px;display:flex;flex-direction:column;gap:8px}
.aim{padding:8px 12px;border-radius:12px;max-width:88%;font-size:16px;line-height:1.5;white-space:pre-wrap}.aim.a{background:var(--surface);border:1px solid var(--line);align-self:flex-start}.aim.u{background:var(--brand2);color:#fff;align-self:flex-end}
.aif{display:flex;gap:8px;padding:8px;border-top:1px solid var(--line)}nav.nv a{touch-action:manipulation}
footer{padding:22px 0 80px;text-align:center;color:var(--muted);font-size:14px}
</style></head><body>
